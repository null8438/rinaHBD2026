<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>だらん｜のんびり旅の宿予約</title>
<style>
  :root {
    --main: #e8613c;
    --main-dark: #c94a28;
    --accent: #ffb400;
    --bg: #f6f3ef;
    --card: #ffffff;
    --text: #2b2b2b;
    --sub: #777;
    --line: #e4ded6;
    --ok: #1f9d6b;
    --ng: #b8b0a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  button { font-family: inherit; }
  a { color: inherit; }

  /* ---------- header ---------- */
  header {
    background: var(--main);
    color: #fff;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  .hd {
    max-width: 1080px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
  }
  .logo {
    font-size: 28px; font-weight: 900; letter-spacing: .04em;
    cursor: pointer; user-select: none;
    display: flex; align-items: baseline; gap: 8px;
  }
  .logo small { font-size: 11px; font-weight: 500; opacity: .9; letter-spacing: 0; }
  .hd nav { margin-left: auto; display: flex; gap: 14px; font-size: 13px; }
  .hd nav span { opacity: .9; }
  @media (max-width: 600px) { .hd nav { display: none; } }

  .tabs { background: var(--main-dark); }
  .tabs ul {
    max-width: 1080px; margin: 0 auto; padding: 0 16px;
    list-style: none; display: flex; gap: 4px; overflow-x: auto;
  }
  .tabs li {
    color: #fff; font-size: 13px; padding: 8px 14px; white-space: nowrap;
    opacity: .85;
  }
  .tabs li.on { background: var(--bg); color: var(--main-dark); font-weight: 700; opacity: 1; border-radius: 6px 6px 0 0; }

  main { max-width: 1080px; margin: 0 auto; padding: 16px; }

  /* ---------- search box ---------- */
  .search {
    background: var(--card); border-radius: 10px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 10px; align-items: end;
  }
  .search label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 4px; }
  .search input, .search select, .form input, .form select, .form textarea {
    width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 15px; font-family: inherit; background: #fff; color: var(--text);
  }
  .btn {
    background: var(--main); color: #fff; border: none; border-radius: 6px;
    padding: 11px 22px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--main-dark); }
  .btn:disabled { background: var(--ng); cursor: not-allowed; }
  .btn.big { width: 100%; padding: 15px; font-size: 17px; }
  .btn.ghost { background: #fff; color: var(--main); border: 1px solid var(--main); }
  @media (max-width: 760px) {
    .search { grid-template-columns: 1fr 1fr; }
    .search .kw, .search .go { grid-column: 1 / -1; }
  }

  .campaign {
    margin: 16px 0; border-radius: 10px; padding: 14px 18px;
    background: linear-gradient(90deg, #fff3d6, #ffe1d3);
    border: 1px dashed var(--accent);
    display: flex; gap: 12px; align-items: center; font-size: 14px;
  }
  .campaign b { color: var(--main-dark); }

  h2.sec { font-size: 18px; margin: 24px 0 10px; border-left: 5px solid var(--main); padding-left: 10px; }
  .count { font-size: 13px; color: var(--sub); margin-bottom: 10px; }

  /* ---------- list ---------- */
  .plan {
    background: var(--card); border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    display: grid; grid-template-columns: 260px 1fr 200px;
    margin-bottom: 14px; cursor: pointer; transition: box-shadow .15s, transform .15s;
  }
  .plan:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); transform: translateY(-1px); }
  .thumb {
    min-height: 180px; display: flex; align-items: center; justify-content: center;
    font-size: 72px; position: relative;
  }
  .thumb .area {
    position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); color: #fff;
    font-size: 11px; padding: 2px 8px; border-radius: 3px;
  }
  .plan .body { padding: 14px 16px; }
  .plan h3 { margin: 0 0 4px; font-size: 18px; color: #1a5fa8; }
  .plan:hover h3 { text-decoration: underline; }
  .stars { color: var(--accent); font-size: 14px; }
  .stars em { color: var(--text); font-style: normal; font-weight: 700; margin-left: 4px; }
  .stars span { color: var(--sub); font-size: 12px; margin-left: 4px; }
  .catch { font-size: 13px; margin: 6px 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; color: var(--sub); background: #faf8f5; }
  .plan .side {
    padding: 14px 16px; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; justify-content: center; align-items: flex-end; gap: 6px;
    text-align: right;
  }
  .price { font-size: 24px; font-weight: 900; color: var(--main-dark); }
  .price small { font-size: 12px; font-weight: 400; color: var(--sub); }
  .pt { font-size: 12px; color: var(--ok); }
  .status { font-size: 12px; font-weight: 700; border-radius: 3px; padding: 2px 8px; }
  .status.ok { background: #e3f6ee; color: var(--ok); }
  .status.ng { background: #eee; color: #888; }
  .plan.soldout { opacity: .7; }
  @media (max-width: 760px) {
    .plan { grid-template-columns: 1fr; }
    .thumb { min-height: 140px; }
    .plan .side { border-left: none; border-top: 1px solid var(--line); flex-direction: row; justify-content: space-between; align-items: center; }
  }

  /* ---------- detail ---------- */
  .crumb { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
  .crumb a { color: #1a5fa8; cursor: pointer; text-decoration: underline; }
  .hero { border-radius: 10px; height: 240px; display: flex; align-items: center; justify-content: center; font-size: 110px; position: relative; }
  .hero .area { font-size: 12px; }
  .detail {
    display: grid; grid-template-columns: 1fr 320px; gap: 16px; margin-top: 16px; align-items: start;
  }
  .box { background: var(--card); border-radius: 10px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .box h1 { font-size: 22px; margin: 0 0 6px; }
  .box h4 { margin: 18px 0 8px; font-size: 15px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
  .box ul { margin: 0; padding-left: 20px; font-size: 14px; }
  .info { width: 100%; border-collapse: collapse; font-size: 14px; }
  .info th { text-align: left; width: 90px; color: var(--sub); font-weight: 500; padding: 6px 0; vertical-align: top; }
  .info td { padding: 6px 0; }
  .review { background: #faf8f5; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; }
  .review b { font-size: 12px; color: var(--sub); font-weight: 500; }
  .sticky { position: sticky; top: 110px; }
  .sumrow { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .sumrow.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 10px; font-weight: 700; }
  .sumrow.total span:last-child { color: var(--main-dark); font-size: 22px; }
  .soldmsg { background: #f3f0ec; border-radius: 6px; padding: 12px; font-size: 13px; color: #666; text-align: center; }
  @media (max-width: 860px) {
    .detail { grid-template-columns: 1fr; }
    .sticky { position: static; }
    .hero { height: 180px; font-size: 80px; }
  }

  /* ---------- form ---------- */
  .steps { display: flex; gap: 0; margin-bottom: 16px; font-size: 12px; }
  .steps div { flex: 1; text-align: center; padding: 8px 4px; background: #e9e4dd; color: #888; position: relative; }
  .steps div.on { background: var(--main); color: #fff; font-weight: 700; }
  .steps div.done { background: #f2b9a8; color: #fff; }
  .form .row { margin-bottom: 14px; }
  .form label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .form label .req { background: var(--main); color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; }
  .form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .err { color: #d0302f; font-size: 12px; margin-top: 4px; display: none; }
  .row.bad .err { display: block; }
  .row.bad input, .row.bad select { border-color: #d0302f; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
  .check input { width: auto; margin-top: 4px; }

  /* ---------- done ---------- */
  .done { text-align: center; padding: 30px 18px; }
  .done .big-icon { font-size: 64px; }
  .done h1 { color: var(--main-dark); }
  .ticket {
    max-width: 480px; margin: 18px auto; text-align: left;
    border: 2px dashed var(--main); border-radius: 10px; padding: 16px 18px; background: #fffaf6;
  }
  .ticket .no { font-size: 13px; color: var(--sub); }
  .ticket .no b { font-size: 20px; color: var(--text); letter-spacing: .1em; }
  .bday {
    max-width: 480px; margin: 18px auto 0; padding: 18px; border-radius: 10px;
    background: linear-gradient(135deg, #ffe0ea, #fff1cc); font-size: 15px; line-height: 1.9;
  }
  .bday b { font-size: 20px; color: #d6336c; display: block; margin-bottom: 4px; }

  footer { text-align: center; font-size: 11px; color: var(--sub); padding: 30px 16px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo" onclick="go('list')">だらん <small>のんびり旅の宿予約</small></div>
    <nav><span>ポイント 2,026pt</span><span>予約の確認</span><span>マイページ</span></nav>
  </div>
  <div class="tabs"><ul>
    <li class="on">国内宿泊</li><li>温泉</li><li>ホテル</li><li>レンタカー</li><li>遊び・体験</li><li>ゴルフ</li>

<main id="app"></main>

<footer>© だらん ― ごろごろ、だらだら、いい旅を。<br>※このサイトは個人用のおあそびサイトです。実際の予約・決済は行われません。</footer>

/* =====================================================
   設定ここだけいじればOK

const DONE_MESSAGE_BODY  = "この旅はプレゼントです。<br>当日はなんにも考えずに、だら〜んとしてね。";

// 宿のデータ
const HOTELS = [

    plan: "【記念日プラン】ケーキ＆スパークリング付き 季節の会席と貸切露天",

    points: ["客室露天風呂で好きなだけ温泉", "夕食は部屋でゆっくり季節の会席", "記念日ケーキとスパークリングワイン付き", "浴衣・色浴衣の貸出あり"],
    review: ["とにかく何もしない贅沢を味わえました。また来ます！（20代女性）", "部屋のお風呂から見える山がきれい。朝ごはんも最高。（30代カップル）"],
  },
  {
    id: "kyoto",
    name: "京都 町家ステイ ゆるり家",
    area: "京都 > 祇園・東山",
    emoji: "⛩️",
    bg: "linear-gradient(135deg,#a18cd1,#fbc2eb)",
    rating: 4.6, reviews: 842,
    price: 24000,
    catch: "築100年の町家を一棟貸し。坪庭を眺めながら朝寝坊できる、京都暮らし体験。",
    tags: ["一棟貸し", "町家", "朝食付き", "駅近"],
    plan: "【一棟貸し】京のおばんざい朝食付き",
    access: "祇園四条駅から徒歩7分",
    checkin: "16:00 〜 / チェックアウト 〜11:00",
    points: ["檜風呂付きの一棟貸し", "朝食は近所のおばんざい屋さんから", "着物レンタル割引あり"],
    review: ["暮らすように泊まれて楽しかった。（20代女性）"],
  },
  {
    id: "ishigaki",
    name: "石垣島 ビーチリゾート ねそべりテラス",
    area: "沖縄 > 石垣島",
    emoji: "🏝️",
    bg: "linear-gradient(135deg,#43e97b,#38f9d7)",
    rating: 4.7, reviews: 2031,
    price: 36000,
    catch: "目の前はエメラルドグリーンの海。プールサイドのハンモックで一日中ねそべれます。",
    tags: ["オーシャンビュー", "プール", "朝夕食付き", "空港送迎"],

    access: "新石垣空港から車で20分（無料送迎あり）",
    checkin: "14:00 〜 / チェックアウト 〜11:00",
    points: ["全室オーシャンビュー", "インフィニティプール", "星空ツアー無料"],
    review: ["海の色が本当にきれい。何もしないで過ごしました。（30代女性）"],
  },
  {
    id: "furano",
    name: "富良野 ラベンダーの丘 ごろりロッジ",
    area: "北海道 > 富良野・美瑛",
    emoji: "💜",
    bg: "linear-gradient(135deg,#c471f5,#fa71cd)",
    rating: 4.5, reviews: 611,
    price: 21000,
    catch: "丘の上の小さなロッジ。暖炉の前のソファでごろりとしながら、北海道の恵みを。",
    tags: ["暖炉", "朝夕食付き", "天然温泉", "絶景"],
    plan: "【スタンダード】北海道ジンギスカンディナー付き",
    access: "富良野駅から車で15分",
    checkin: "15:00 〜 / チェックアウト 〜10:00",
    points: ["暖炉のあるラウンジ", "とれたて野菜のディナー", "冬はスノーシュー体験"],
    review: ["景色も料理も最高でした。（20代カップル）"],
  },
  {
    id: "kanazawa",
    name: "金沢 ひがし茶屋街 宿 のんびり楼",
    area: "石川 > 金沢",
    emoji: "🍣",
    bg: "linear-gradient(135deg,#ff9a9e,#fecfef)",
    rating: 4.6, reviews: 977,
    price: 26000,
    catch: "茶屋街まで歩いてすぐ。のどぐろと加賀料理をゆっくり味わう、食い倒れ旅に。",
    tags: ["和室", "朝夕食付き", "大浴場", "観光便利"],
    plan: "【美食】のどぐろ会席プラン",
    access: "金沢駅からバスで10分",
    checkin: "15:00 〜 / チェックアウト 〜10:00",
    points: ["加賀料理の会席", "金箔体験チケット付き", "茶屋街まで徒歩3分"],
    review: ["ごはんが美味しすぎて食べすぎました。（30代女性）"],
  },
  {
    id: "kusatsu",
    name: "草津温泉 湯畑そば ぽかぽか館",
    area: "群馬 > 草津温泉",
    emoji: "🧖",
    bg: "linear-gradient(135deg,#89f7fe,#66a6ff)",
    rating: 4.4, reviews: 1532,
    price: 19000,
    catch: "湯畑まで徒歩1分。日本三名泉のお湯に何度でも浸かれる、湯めぐり好きの宿。",
    tags: ["源泉かけ流し", "湯めぐり手形付き", "朝夕食付き"],
    plan: "【湯めぐり】外湯手形付きスタンダードプラン",
    access: "草津温泉バスターミナルから徒歩5分",
    checkin: "15:00 〜 / チェックアウト 〜10:00",
    points: ["湯畑まで徒歩1分", "外湯めぐり手形付き", "夜の湯畑ライトアップ"],
    review: ["お湯が最高。肌がつるつるに。（20代女性）"],
  },
];

/* ===================================================== */

const state = { view: "list", hotelId: null, booking: null };
const app = document.getElementById("app");
const yen = n => "¥" + n.toLocaleString("ja-JP");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const canBook = h => BOOKABLE_ID === null || h.id === BOOKABLE_ID;
const findHotel = id => HOTELS.find(h => h.id === id);
const starStr = r => "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r));

function isoDate(d) {
  const z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function jpDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;
}
function nights(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

const search = {
  checkin: isoDate(addDays(new Date(), 14)),
  checkout: isoDate(addDays(new Date(), 15)),
  adults: 2,
  keyword: "",
};

function go(view, hotelId) {
  state.view = view;
  if (hotelId !== undefined) state.hotelId = hotelId;
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (state.view === "list") renderList();
  else if (state.view === "detail") renderDetail();
  else if (state.view === "form") renderForm();
  else if (state.view === "confirm") renderConfirm();
  else if (state.view === "done") renderDone();
}

/* ---------- 一覧 ---------- */
function renderList() {
  const kw = search.keyword.trim();
  const list = HOTELS.filter(h => !kw || (h.name + h.area + h.tags.join("")).includes(kw));
  // 予約可の宿を上に
  list.sort((a, b) => canBook(b) - canBook(a));

  app.innerHTML = `
    <div class="search">
      <div class="kw"><label>エリア・キーワード</label>
        <input id="kw" placeholder="例：温泉、京都、沖縄" value="${esc(search.keyword)}"></div>
      <div><label>チェックイン</label><input type="date" id="ci" value="${search.checkin}"></div>
      <div><label>チェックアウト</label><input type="date" id="co" value="${search.checkout}"></div>
      <div><label>大人</label>
        <select id="ad">${[1,2,3,4].map(n => `<option ${n === search.adults ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="go"><button class="btn" id="sbtn" style="width:100%">検索</button></div>
    </div>

    <div class="campaign">🎁 <div><b>だらんスペシャルクーポン配布中！</b><br>今なら対象の宿が<b>最大100%OFF</b>（※大切な人からの贈りもの限定）</div></div>

    <h2 class="sec">おすすめの旅先</h2>
    <div class="count">${list.length}件の宿が見つかりました ／ ${jpDate(search.checkin)} から ${nights(search.checkin, search.checkout)}泊・大人${search.adults}名</div>
    ${list.length ? list.map(cardHtml).join("") : `<div class="box">該当する宿が見つかりませんでした。</div>`}
  `;

  const apply = () => {
    search.keyword = document.getElementById("kw").value;
    search.checkin = document.getElementById("ci").value || search.checkin;
    search.checkout = document.getElementById("co").value || search.checkout;
    if (nights(search.checkin, search.checkout) < 1) search.checkout = isoDate(addDays(new Date(search.checkin), 1));
    search.adults = +document.getElementById("ad").value;
    renderList();
  };
  document.getElementById("sbtn").onclick = apply;
  document.getElementById("kw").onkeydown = e => { if (e.key === "Enter") apply(); };
  app.querySelectorAll(".plan").forEach(el => el.onclick = () => go("detail", el.dataset.id));
}

function cardHtml(h) {
  const ok = canBook(h);
  return `
  <div class="plan ${ok ? "" : "soldout"}" data-id="${h.id}">
    <div class="thumb" style="background:${h.bg}"><span class="area">${esc(h.area)}</span>${h.emoji}</div>
    <div class="body">
      <h3>${esc(h.name)}</h3>
      <div class="stars">${starStr(h.rating)}<em>${h.rating.toFixed(1)}</em><span>（クチコミ${h.reviews.toLocaleString()}件）</span></div>
      <div class="catch">${esc(h.catch)}</div>
      <div class="tags">${h.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>
    <div class="side">
      <div>
        <span class="status ${ok ? "ok" : "ng"}">${ok ? "◎ 空室あり" : "× 満室"}</span>
      </div>
      <div>
        <div class="price">${yen(h.price)}<small>〜 /人泊</small></div>
        <div class="pt">${Math.floor(h.price * 0.02).toLocaleString()}pt たまる</div>
      </div>
    </div>
  </div>`;
}

/* ---------- 詳細 ---------- */
function renderDetail() {
  const h = findHotel(state.hotelId);
  const ok = canBook(h);
  const n = Math.max(1, nights(search.checkin, search.checkout));
  const total = h.price * search.adults * n;

  app.innerHTML = `
    <div class="crumb"><a onclick="go('list')">だらんトップ</a> ＞ ${esc(h.area)} ＞ ${esc(h.name)}</div>
    <div class="hero" style="background:${h.bg}"><span class="area thumb-area" style="position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;padding:2px 8px;border-radius:3px">${esc(h.area)}</span>${h.emoji}</div>
    <div class="detail">
      <div class="box">
        <h1>${esc(h.name)}</h1>
        <div class="stars">${starStr(h.rating)}<em>${h.rating.toFixed(1)}</em><span>（クチコミ${h.reviews.toLocaleString()}件）</span></div>
        <p style="font-size:14px">${esc(h.catch)}</p>
        <div class="tags">${h.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>

        <h4>プラン</h4>
        <p style="font-size:14px;margin:0">${esc(h.plan)}</p>

        <h4>この宿のおすすめポイント</h4>
        <ul>${h.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>

        <h4>宿泊情報</h4>
        <table class="info">
          <tr><th>アクセス</th><td>${esc(h.access)}</td></tr>
          <tr><th>時間</th><td>${esc(h.checkin)}</td></tr>
        </table>

        <h4>クチコミ</h4>
        ${h.review.map(r => `<div class="review"><b>★★★★★</b><br>${esc(r)}</div>`).join("")}
      </div>

      <div class="box sticky">
        <div style="font-weight:700;margin-bottom:8px">料金シミュレーション</div>
        <div class="sumrow"><span>チェックイン</span><span>${jpDate(search.checkin)}</span></div>
        <div class="sumrow"><span>泊数</span><span>${n}泊</span></div>
        <div class="sumrow"><span>人数</span><span>大人${search.adults}名</span></div>
        <div class="sumrow"><span>1人1泊</span><span>${yen(h.price)}</span></div>
        <div class="sumrow total"><span>合計（税込）</span><span>${yen(total)}</span></div>
        <div style="margin-top:14px">
          ${ok
            ? `<button class="btn big" id="bookbtn">このプランを予約する</button>`
            : `<div class="soldmsg">ごめんなさい、この日程は<b>満室</b>です。<br>ほかの宿をさがしてみてください。</div>
               <button class="btn ghost big" style="margin-top:10px" onclick="go('list')">一覧にもどる</button>`}
        </div>
      </div>
    </div>
  `;
  if (ok) document.getElementById("bookbtn").onclick = () => {
    state.booking = state.booking && state.booking.hotelId === h.id ? state.booking : {
      hotelId: h.id, checkin: search.checkin, checkout: search.checkout, adults: search.adults,
      name: "", kana: "", email: "", tel: "", arrival: "15:00", request: "",
    };
    go("form");
  };
}

function stepsHtml(i) {
  const names = ["プラン選択", "お客様情報入力", "内容の確認", "予約完了"];
  return `<div class="steps">${names.map((n, k) => `<div class="${k === i ? "on" : k < i ? "done" : ""}">${k + 1}. ${n}</div>`).join("")}</div>`;
}

/* ---------- 入力 ---------- */
function renderForm() {
  const b = state.booking, h = findHotel(b.hotelId);
  const times = ["15:00","15:30","16:00","16:30","17:00","17:30","18:00","19:00"];
  app.innerHTML = `
    ${stepsHtml(1)}
    <div class="detail">
      <div class="box form">
        <h1 style="font-size:20px">お客様情報の入力</h1>
        <div class="row two">
          <div><label>チェックイン<span class="req">必須</span></label><input type="date" id="f-ci" value="${b.checkin}"></div>
          <div><label>チェックアウト<span class="req">必須</span></label><input type="date" id="f-co" value="${b.checkout}"></div>
          <div class="err" style="grid-column:1/-1">チェックアウトはチェックインより後の日付にしてください</div>
        </div>
        <div class="row two">
          <div><label>大人</label><select id="f-ad">${[1,2,3,4].map(n => `<option ${n === b.adults ? "selected" : ""}>${n}</option>`).join("")}</select></div>
          <div><label>到着予定時刻</label><select id="f-ar">${times.map(t => `<option ${t === b.arrival ? "selected" : ""}>${t}</option>`).join("")}</select></div>
        </div>
        <div class="row"><label>宿泊代表者 氏名<span class="req">必須</span></label><input id="f-name" placeholder="例：山田 花子" value="${esc(b.name)}"><div class="err">氏名を入力してください</div></div>
        <div class="row"><label>フリガナ</label><input id="f-kana" placeholder="例：ヤマダ ハナコ" value="${esc(b.kana)}"></div>
        <div class="row"><label>メールアドレス</label><input id="f-email" type="email" placeholder="example@daran.jp" value="${esc(b.email)}"></div>
        <div class="row"><label>電話番号</label><input id="f-tel" type="tel" placeholder="090-0000-0000" value="${esc(b.tel)}"></div>
        <div class="row"><label>宿へのご要望</label><textarea id="f-req" rows="3" placeholder="例：誕生日なので、ケーキにメッセージを入れてほしいです">${esc(b.request)}</textarea></div>
        <div class="row"><label class="check"><input type="checkbox" id="f-agree"> 宿泊約款とキャンセルポリシーに同意する（だらだらすることに同意する）</label><div class="err">同意にチェックしてください</div></div>
        <button class="btn big" id="next">確認画面へすすむ</button>
        <div style="text-align:center;margin-top:10px"><a style="font-size:13px;cursor:pointer;color:#1a5fa8;text-decoration:underline" onclick="go('detail')">← 宿の詳細にもどる</a></div>
      </div>
      ${summaryBox(h, b)}
    </div>`;

  const read = () => {
    b.checkin = document.getElementById("f-ci").value;
    b.checkout = document.getElementById("f-co").value;
    b.adults = +document.getElementById("f-ad").value;
    b.arrival = document.getElementById("f-ar").value;
    b.name = document.getElementById("f-name").value.trim();
    b.kana = document.getElementById("f-kana").value.trim();
    b.email = document.getElementById("f-email").value.trim();
    b.tel = document.getElementById("f-tel").value.trim();
    b.request = document.getElementById("f-req").value.trim();
  };
  ["f-ci","f-co","f-ad"].forEach(id => document.getElementById(id).onchange = () => {
    read(); app.querySelector(".detail > .box:last-child").outerHTML = summaryBox(h, b);
  });
  document.getElementById("next").onclick = () => {
    read();
    const rows = app.querySelectorAll(".form .row");
    rows.forEach(r => r.classList.remove("bad"));
    let good = true;
    if (!b.checkin || !b.checkout || nights(b.checkin, b.checkout) < 1) { rows[0].classList.add("bad"); good = false; }
    if (!b.name) { rows[2].classList.add("bad"); good = false; }
    if (!document.getElementById("f-agree").checked) { rows[7].classList.add("bad"); good = false; }
    if (good) go("confirm");
  };
}

function summaryBox(h, b) {
  const n = Math.max(1, nights(b.checkin, b.checkout));
  return `
    <div class="box sticky">
      <div style="font-size:24px;text-align:center;border-radius:6px;padding:12px;background:${h.bg}">${h.emoji}</div>
      <div style="font-weight:700;margin:8px 0 4px">${esc(h.name)}</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">${esc(h.plan)}</div>
      <div class="sumrow"><span>日程</span><span>${b.checkin ? jpDate(b.checkin) : "-"}</span></div>
      <div class="sumrow"><span>泊数・人数</span><span>${n}泊・大人${b.adults}名</span></div>
      <div class="sumrow"><span>宿泊料金</span><span>${yen(h.price * b.adults * n)}</span></div>
      <div class="sumrow"><span>スペシャルクーポン</span><span style="color:var(--ok)">-${yen(h.price * b.adults * n)}</span></div>
      <div class="sumrow total"><span>お支払い金額</span><span>${yen(0)}</span></div>
    </div>`;
}

/* ---------- 確認 ---------- */
function renderConfirm() {
  const b = state.booking, h = findHotel(b.hotelId);
  const n = nights(b.checkin, b.checkout);
  app.innerHTML = `
    ${stepsHtml(2)}
    <div class="detail">
      <div class="box">
        <h1 style="font-size:20px">ご予約内容の確認</h1>
        <table class="info">
          <tr><th>宿</th><td>${esc(h.name)}</td></tr>
          <tr><th>プラン</th><td>${esc(h.plan)}</td></tr>
          <tr><th>日程</th><td>${jpDate(b.checkin)} 〜 ${jpDate(b.checkout)}（${n}泊）</td></tr>
          <tr><th>人数</th><td>大人${b.adults}名</td></tr>
          <tr><th>到着予定</th><td>${esc(b.arrival)}</td></tr>
          <tr><th>代表者</th><td>${esc(b.name)}${b.kana ? `（${esc(b.kana)}）` : ""}</td></tr>
          ${b.email ? `<tr><th>メール</th><td>${esc(b.email)}</td></tr>` : ""}
          ${b.tel ? `<tr><th>電話</th><td>${esc(b.tel)}</td></tr>` : ""}
          ${b.request ? `<tr><th>ご要望</th><td>${esc(b.request)}</td></tr>` : ""}
        </table>
        <button class="btn big" id="ok" style="margin-top:18px">この内容で予約を確定する</button>
        <button class="btn ghost big" style="margin-top:10px" onclick="go('form')">入力内容を修正する</button>
      </div>
      ${summaryBox(h, b)}
    </div>`;
  document.getElementById("ok").onclick = () => {
    b.no = "DR" + Math.random().toString().slice(2, 10);
    go("done");
  };
}

/* ---------- 完了 ---------- */
function renderDone() {
  const b = state.booking, h = findHotel(b.hotelId);
  const n = nights(b.checkin, b.checkout);
  app.innerHTML = `
    ${stepsHtml(3)}
    <div class="box done">
      <div class="big-icon">🎉</div>
      <h1>ご予約が完了しました！</h1>
      <p style="font-size:14px">${esc(b.name)} 様、だらんをご利用いただきありがとうございます。</p>
      <div class="ticket">
        <div class="no">予約番号　<b>${b.no}</b></div>
        <div style="margin-top:10px;font-weight:700">${h.emoji} ${esc(h.name)}</div>
        <div style="font-size:13px;margin-top:4px">${jpDate(b.checkin)} 〜 ${jpDate(b.checkout)}（${n}泊）・大人${b.adults}名</div>
        <div style="font-size:13px">${esc(h.plan)}</div>
        <div style="font-size:13px;color:var(--sub);margin-top:6px">${esc(h.access)}</div>
      </div>
      ${DONE_MESSAGE_TITLE || DONE_MESSAGE_BODY ? `<div class="bday"><b>${DONE_MESSAGE_TITLE}</b>${DONE_MESSAGE_BODY}</div>` : ""}
      <div style="margin-top:22px"><button class="btn ghost" onclick="state.booking=null;go('list')">トップへもどる</button></div>
    </div>`;
}

render();
</script>
</body>
</html>
